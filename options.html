<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>YT AdShield – Cài đặt</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.55;
    }
    h1 { font-size: 20px; }
    fieldset {
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 10px;
      margin: 0 0 16px;
      padding: 12px 16px 14px;
    }
    legend { font-weight: 600; padding: 0 6px; }
    label.check {
      display: flex;
      gap: 10px;
      align-items: baseline;
      margin: 10px 0;
      cursor: pointer;
    }
    label.check small { opacity: 0.7; }
    textarea {
      width: 100%;
      min-height: 90px;
      box-sizing: border-box;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
    }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    button {
      font: inherit;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      background: color-mix(in srgb, currentColor 8%, transparent);
      cursor: pointer;
    }
    button:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
    #status { opacity: 0; transition: opacity 0.2s; }
    #status.show { opacity: 0.85; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
  </style>
</head>
<body>
  <h1>YT AdShield – Cài đặt</h1>
  <p>Bấm icon extension trên thanh công cụ cũng mở trang này.</p>

  <fieldset>
    <legend>Tính năng</legend>
    <label class="check">
      <input type="checkbox" id="cosmetic" />
      <span>Ẩn quảng cáo giao diện <small>(feed, kết quả tìm kiếm, masthead, popup Premium…)</small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="killEnforcement" />
      <span>Tự đóng cảnh báo "phát hiện ad-block" <small>(gỡ hộp thoại + nhả khoá cuộn trang)</small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="autoPlay" />
      <span>Tự phát lại video khi player cố dừng vì cảnh báo</span>
    </label>
    <label class="check">
      <input type="checkbox" id="noAdFlag" />
      <span>Ra lệnh server không trả quảng cáo <small>(<code>isInlinePlaybackNoAd</code> – chống cả "fake buffering" làm chậm video)</small></span>
    </label>
  </fieldset>

  <fieldset>
    <legend>Khóa dữ liệu quảng cáo bổ sung</legend>
    <p>
      Phòng khi YouTube đổi tên trường dữ liệu: thêm tên khóa cần cắt, mỗi dòng một tên
      (chữ cái/số/gạch dưới). Mặc định tool đã cắt <code>adPlacements</code>,
      <code>adSlots</code>, <code>playerAds</code>.
    </p>
    <textarea id="extraKeys" spellcheck="false" placeholder="vd: adBreaks"></textarea>
  </fieldset>

  <div class="row">
    <button id="save">Lưu</button>
    <span id="status">Đã lưu.</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
